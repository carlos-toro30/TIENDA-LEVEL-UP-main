<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Level-Up Gamer</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <a href="../PaginaMadre.html" class="navbar-brand">👾 Level-Up Gamer</a>
            
            <nav class="navbar-nav" style="display: flex; list-style: none; margin: 0; padding: 0;">
                <a href="../PaginaMadre.html" class="nav-link">Home</a>
                <a href="Productos.html" class="nav-link">Productos</a>
                <a href="Nosotros.html" class="nav-link">Nosotros</a>
                <a href="Blogs.html" class="nav-link">Blogs</a>
                <a href="Contacto.html" class="nav-link">Contacto</a>
            </nav>

            <div class="navbar-nav" style="display: flex;">
                <a href="Carrito.html" class="nav-link active" style="text-decoration: none;">
                    🛒 Cart (<span id="cart-count">0</span>)
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main style="max-width: 1100px; margin: 0 auto;">
        <h2 style="text-align: left; border-bottom: 2px solid #1E90FF; padding-bottom: 10px; margin-bottom: 30px;">
            Mi carrito de compras
        </h2>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px; align-items: start;">
            
            <!-- LISTA DE PRODUCTOS EN CARRITO -->
            <div id="cart-items-container" style="display: flex; flex-direction: column; gap: 20px;">
                <!-- Se llena dinámicamente con app.js -->
            </div>

            <!-- PANEL DE RESUMEN Y CUPÓN -->
            <div class="blog-card" style="padding: 25px; border-left: 2px solid #1E90FF;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <span style="font-family: 'Orbitron', sans-serif; font-size: 18px;">TOTAL:</span>
                    <span id="cart-total" style="font-family: 'Orbitron', sans-serif; font-size: 24px; color: #39FF14; font-weight: bold;">$0</span>
                </div>

                <div id="discount-info" style="display: none; color: #39FF14; font-size: 13px; margin-bottom: 15px;">
                    ¡Cupón aplicado con éxito!
                </div>

                <hr style="border-color: #1E90FF; margin-bottom: 20px;">

                <div style="margin-bottom: 25px;">
                    <label for="coupon-input" style="font-size: 12px; color: #D3D3D3; display: block; margin-bottom: 8px;">
                        Ingrese el cupón de descuento
                    </label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="coupon-input" placeholder="Ej: LEVELUP10" style="flex: 1; padding: 8px; background: #000; border: 1px solid #1E90FF; color: #FFF; border-radius: 4px; font-family: 'Roboto', sans-serif;">
                        <button onclick="applyDiscountCoupon()" style="background: #1E90FF; color: #FFF; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">APLICAR</button>
                    </div>
                </div>

                <button onclick="processCheckout()" class="blog-btn" style="width: 100%; background-color: #39FF14; color: #000000; border: none; font-size: 18px; text-align: center; cursor: pointer; padding: 12px;">
                    PAGAR
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p style="margin: 0; color: #D3D3D3;">&copy; 2026 Level-Up Gamer. Desafía tus límites.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        // Renderizar el carrito al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            renderCartPage();
        });
    </script>
</body>
</html>
