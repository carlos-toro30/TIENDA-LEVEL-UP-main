<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Level-Up Gamer</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <header class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <a href="principal.html" class="navbar-brand">👾 Level-Up Gamer</a>
            
            <nav class="navbar-nav" style="display: flex; list-style: none; margin: 0; padding: 0;">
                <a href="principal.html" class="nav-link">Home</a>
                <a href="producto.html" class="nav-link">Productos</a>
                <a href="nosotros.html" class="nav-link">Nosotros</a>
                <a href="blog.html" class="nav-link">Blogs</a>
                <a href="contacto.html" class="nav-link active">Contacto</a>
            </nav>

            <div class="navbar-nav" style="display: flex;">
                <div class="nav-link" onclick="toggleCart()" style="cursor: pointer;">
                    🛒 Cart (<span id="cart-count">0</span>)
                </div>
            </div>
        </div>
    </header>

  
    <main>
        <!-- Ícono / Banner Central -->
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="display: inline-block; width: 120px; height: 70px; border: 2px solid #1E90FF; border-radius: 8px; line-height: 70px; font-size: 32px; background-color: #000000;">
                👾
            </div>
            <h1 style="font-family: 'Orbitron', sans-serif; font-size: 26px; color: #FFFFFF; margin-top: 15px; text-transform: uppercase;">
                Level-Up Gamer
            </h1>
        </div>

        <!-- FORMULARIO DE CONTACTO -->
        <div class="Blog" style="grid-template-columns: 1fr; max-width: 550px;">
            <div class="blog-card">
                <div class="blog-content">
                    <h3 style="text-align: center; border-bottom: 2px solid #1E90FF; padding-bottom: 10px; margin-bottom: 20px;">

                    </h3>

                    <form id="contacto-form" novalidate style="display: flex; flex-direction: column; gap: 18px;">
                        
                        <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <label for="contact-nombre" style="font-family: 'Orbitron', sans-serif; font-size: 13px; color: #FFFFFF;">
  
                            </label>
                            <input type="text" id="contact-nombre" maxlength="100" style="padding: 10px; background-color: #000000; border: 1px solid #1E90FF; color: #FFFFFF; border-radius: 6px; font-family: 'Roboto', sans-serif;">
                            <span class="error-msg" id="err-contact-nombre" style="color: #39FF14; font-size: 13px;">Ingrese su nombre de Usuario: </span>
                        </div>

                        <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <label for="contact-email" style="font-family: 'Orbitron', sans-serif; font-size: 13px; color: #FFFFFF;">

                            </label>
                            <input type="email" id="contact-email" maxlength="100" style="padding: 10px; background-color: #000000; border: 1px solid #1E90FF; color: #FFFFFF; border-radius: 6px; font-family: 'Roboto', sans-serif;">
                            <span class="error-msg" id="err-contact-email" style="color: #39FF14; font-size: 13px;">Ingrese su correo electrónico: </span>
                        </div>

                        <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <label for="contact-mensaje" style="font-family: 'Orbitron', sans-serif; font-size: 13px; color: #FFFFFF;">

                            </label>
                            <textarea id="contact-mensaje" rows="4" style="padding: 10px; background-color: #000000; border: 1px solid #1E90FF; color: #FFFFFF; border-radius: 6px; font-family: 'Roboto', sans-serif; resize: vertical;"></textarea>
                            <span class="error-msg" id="err-contact-mensaje" style="color: #39FF14; font-size: 13px;">Ingrese su mensaje: </span>
                        </div>

                        <button type="submit" class="blog-btn" style="border: none; cursor: pointer; text-align: center; margin: 10px auto 0 auto; min-width: 180px;">
                            ENVIAR MENSAJE
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p style="margin: 0; color: #D3D3D3;">&copy; 2026 Level-Up Gamer. Desafía tus límites.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
