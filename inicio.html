<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion - Level-Up Gamer</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="principal.html" class="navbar-brand">👾 Level-Up Gamer</a>   
            <div class="navbar-nav" style="display: flex;">
                <div class="nav-link active">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL Y FORMULARIO -->
    <main>
        <h2>Iniciar Sesión</h2>

        <div class="Blog" style="grid-template-columns: 1fr; max-width: 500px;">
            <div class="blog-card">
                <div class="blog-content">
                    <form id="login-form" novalidate style="display: flex; flex-direction: column; gap: 20px;">
                        
                        <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <label for="login-email" style="font-family: 'Orbitron', sans-serif; font-size: 14px; color: #FFFFFF;">
                                Correo Electrónico:
                            </label>
                            <input type="email" id="login-email" maxlength="100" style="padding: 12px; background-color: #000000; border: 1px solid #04fc3a; color: #FFFFFF; border-radius: 6px; font-family: 'Roboto', sans-serif;">
                            <span class="error-msg" id="err-login-email" style="color: #39FF14; font-size: 13px;"></span>
                        </div>

                        <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <label for="login-pass" style="font-family: 'Orbitron', sans-serif; font-size: 14px; color: #FFFFFF;">
                                Contraseña:
                            </label>
                            <input type="password" id="login-pass" style="padding: 12px; background-color: #000000; border: 1px solid #2bff00; color: #FFFFFF; border-radius: 6px; font-family: 'Roboto', sans-serif;">
                            <span class="error-msg" id="err-login-pass" style="color: #39FF14; font-size: 13px;"></span>
                        </div>

                        <button type="submit" class="blog-btn" style="border: none; cursor: pointer; text-align: center; margin-top: 10px;">
                            Ingresar
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p style="margin: 0; color: #D3D3D3;">&copy; 2026 Level-Up Gamer. Desafía tus límites.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
